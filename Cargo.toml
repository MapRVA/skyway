[package]
authors = ["Jacob Hall <email@jacobhall.net>"]
description = "A command-line OpenStreetMap file converter"
edition = "2021"
license = "GPL-3.0-or-later"
name = "skyway"
version = "0.2.0"

[lib]
name = "skyway"
path = "src/lib.rs"

[[bin]]
name = "skyway"
path = "src/main.rs"

[dependencies]
bit-vec = { version = "0.8.0", optional = true }
cel-interpreter = "0.8.1"
clap = { version = "4.5.10", features = ["derive"] }
env_logger = "0.11.5"
indicatif = "0.17.8"
itertools = "0.13.0"
json = { version = "0.12.4", optional = true }
lexical = { version = "6.1.1", optional = true }
log = "0.4.22"
once_cell = "1.19.0"
osmpbf = { version = "0.3.4", optional = true }
osmx = { version = "0.2.0", optional = true }
pest = "2.7.11"
pest_derive = "2.7.11"
quick-xml = { version = "0.36.1", features = [
    "overlapped-lists",
    "serialize",
], optional = true }
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde-aux = { version = "4.5.0", optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0.63"

[features]
default = ["json", "o5m", "opl", "osmx", "pbf", "xml"]
json = ["dep:json", "dep:lexical", "dep:serde", "dep:serde_json"]
o5m = ["dep:bit-vec"]
opl = ["dep:lexical"]
osmx = ["dep:osmx"]
pbf = ["dep:osmpbf"]
xml = ["dep:serde", "dep:serde-aux", "dep:quick-xml"]

[profile.release]
lto = "fat"
codegen-units = 1
