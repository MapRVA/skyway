[workspace]
resolver = "3"
members = ["skyway", "skyway-python"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Jacob Hall <email@jacobhall.net>"]
homepage = "https://maprva.github.io/skyway/"
repository = "https://github.com/MapRVA/skyway"

[workspace.dependencies]
skyway = { path = "skyway" }

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install libssl-dev:$CROSS_DEB_ARCH python3",
]

[workspace.metadata.cross.target.x86_64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install libssl-dev:$CROSS_DEB_ARCH python3",
]

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1
