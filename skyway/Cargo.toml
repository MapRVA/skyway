[package]
name = "skyway"
description = "A command-line OpenStreetMap file converter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "skyway"
path = "src/lib.rs"

[[bin]]
name = "skyway"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
bit-vec = { version = "0.10.1", optional = true }
cel-interpreter = { version = "0.10.0", optional = true }
chrono = { version = "0.4.45", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
env_logger = { version = "0.11.11", optional = true }
geo = { version = "0.33.1", optional = true }
geojson = { version = "1.0.0", optional = true }
indicatif = { version = "0.18.6", optional = true }
itertools = "0.15.0"
json = { version = "0.12.4", optional = true }
lexical = "7.0.5"
log = "0.4.34"
osmpbf = { version = "0.3.8", optional = true }
osmx = { version = "0.3.0", optional = true }
pest = { version = "2.9.1", optional = true }
pest_derive = { version = "2.9.1", optional = true }
quick-xml = { version = "0.42.0", features = [
    "overlapped-lists",
    "serialize",
], optional = true }
rayon = "1.12.0"
regex = { version = "1.13.1", optional = true }
reqwest = { version = "0.13.5", features = ["blocking"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde-aux = { version = "4.7.0", optional = true }
serde_json = { version = "1.0.151", optional = true }
tempfile = "3.27.0"
thiserror = "2.0.20"

[dev-dependencies]
toml = "1.1.5+spec-1.1.0"

[features]
default = [
    "cli",
    "geojson",
    "json",
    "o5m",
    "opl",
    "overpass-queries",
    "pbf",
    "xml",
    "filter",
    "cel",
    "skyfilter",
]

# by default, all convert and filter features are enabled
# conversion filetypes
json = ["dep:json", "dep:serde", "dep:serde_json"]
geojson = ["geo", "dep:geojson"]
o5m = ["dep:bit-vec", "dep:chrono"]
opl = []
osmx = ["dep:osmx"]
pbf = ["dep:osmpbf", "dep:chrono"]
xml = ["dep:serde", "dep:serde-aux", "dep:quick-xml"]

# geo type conversion
geo = ["dep:geo"]

# API query sources
overpass-queries = ["xml", "json", "dep:reqwest"]

# general filter support
filter = []

# filter types
cel = ["filter", "dep:cel-interpreter"]
skyfilter = ["filter", "dep:pest", "dep:pest_derive", "dep:regex"]

# cli helpers (required to build binary)
cli = ["dep:clap", "dep:env_logger", "dep:indicatif"]
